name: CI

on:
  push:
    branches: [main]
    paths: ['tideover/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['tideover/**', '.github/workflows/ci.yml']

jobs:
  verify:
    name: verify + engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tideover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tideover/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm test
